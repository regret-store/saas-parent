server:
  port: 8082
spring:
  profiles:
    active: local
  application:
    name: saas-ai-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        import-check:
          enabled: false
  ai:
    openai:
      # 替换成你自己的 API Key
      api-key: ${DEEPSEEK_API_KEY}
      # 修改为 DeepSeek 的地址
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2048 # 🌟 加上这个，防止输出被截断
  data:
    redis:
      host: localhost
      port: 6379
saas:
  internal:
    secret: ${INTERNAL_SECRET}
  jwt:
    secret: ${JWT_SECRET}